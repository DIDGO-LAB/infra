services:
  edge-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: didgo-edge-proxy:latest
    container_name: didgo-edge-proxy
    environment:
      EDGE_CERT_CN: ${EDGE_CERT_CN:-210.96.71.195}
      EDGE_CERT_SAN: ${EDGE_CERT_SAN:-DNS:localhost,IP:127.0.0.1,IP:210.96.71.195}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /etc/nginx/certs
        if [ ! -s /etc/nginx/certs/fullchain.pem ] || [ ! -s /etc/nginx/certs/privkey.pem ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /etc/nginx/certs/privkey.pem \
            -out /etc/nginx/certs/fullchain.pem \
            -subj "/CN=$${EDGE_CERT_CN}" \
            -addext "subjectAltName=$${EDGE_CERT_SAN}"
        fi
        nginx -g 'daemon off;'
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - api-gateway
    networks:
      - didgo-backend

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: didgo-api-gateway:latest
    container_name: didgo-api-gateway
    environment:
      SERVER_PORT: ${API_GATEWAY_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32-bytes-minimum}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      USER_SERVICE_URI: ${USER_SERVICE_URI:-http://user-service:8080}
      TRAINING_SERVICE_URI: ${TRAINING_SERVICE_URI:-http://training-service:8080}
      TRAINING_SERVICE_WS_URI: ${TRAINING_SERVICE_WS_URI:-ws://training-service:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173,https://localhost,https://localhost:5173,http://210.96.71.195:5173,http://210.96.71.195:8081,https://210.96.71.195}
    expose:
      - "8080"
    ports:
      - "${API_GATEWAY_HOST_PORT:-8081}:8080"
    depends_on:
      - user-service
      - training-service
    networks:
      - didgo-backend

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    image: didgo-user-service:latest
    container_name: didgo-user-service
    environment:
      SERVER_PORT: ${USER_SERVICE_PORT:-8080}
      DB_URL: ${USER_DB_URL:-jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
      DB_USERNAME: ${USER_DB_USERNAME:-root}
      DB_PASSWORD: ${USER_DB_PASSWORD:-rootpassword}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32-bytes-minimum}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-internal-api-key}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
    expose:
      - "8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - didgo-backend

  training-service:
    build:
      context: ../training-service
      dockerfile: Dockerfile
    image: didgo-training-service:latest
    container_name: didgo-training-service
    environment:
      SPRING_PROFILES_ACTIVE: ${TRAINING_SERVICE_PROFILE:-local}
      SERVER_PORT: ${TRAINING_SERVICE_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: training_db
      DB_USERNAME: ${TRAINING_DB_USERNAME:-root}
      DB_PASSWORD: ${TRAINING_DB_PASSWORD:-rootpassword}
      TRUSTED_USER_ID_HEADER: ${TRUSTED_USER_ID_HEADER:-X-User-Id}
      OPENAI_ADAPTER: ${OPENAI_ADAPTER:-local-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REALTIME_URL: ${OPENAI_REALTIME_URL:-wss://api.openai.com/v1/realtime}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-mini}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_REALTIME_INPUT_AUDIO_FORMAT: ${OPENAI_REALTIME_INPUT_AUDIO_FORMAT:-audio/pcm}
      OPENAI_REALTIME_INPUT_AUDIO_RATE: ${OPENAI_REALTIME_INPUT_AUDIO_RATE:-24000}
      OPENAI_REALTIME_OUTPUT_AUDIO_FORMAT: ${OPENAI_REALTIME_OUTPUT_AUDIO_FORMAT:-audio/pcm}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-false}
    ports:
      - "${TRAINING_SERVICE_HOST_PORT:-8082}:8080"
    expose:
      - "8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - didgo-backend

  db-init:
    image: mysql:8.4
    container_name: didgo-db-init
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    command:
      - sh
      - -c
      - |
        MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -hmysql -uroot <<SQL
        CREATE DATABASE IF NOT EXISTS user_db
          CHARACTER SET utf8mb4
          COLLATE utf8mb4_unicode_ci;
        CREATE DATABASE IF NOT EXISTS training_db
          CHARACTER SET utf8mb4
          COLLATE utf8mb4_unicode_ci;
        SQL
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - didgo-backend
    restart: "no"

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    image: didgo-client:latest
    container_name: didgo-client
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://210.96.71.195:8081}
      VITE_API_MODE: ${VITE_API_MODE:-real}
    ports:
      - "${CLIENT_HOST_PORT:-5173}:5173"
    depends_on:
      - api-gateway
    networks:
      - didgo-backend

  mysql:
    image: mysql:8.4
    container_name: didgo-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3307:3306"
    volumes:
      - didgo_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - didgo-backend

  redis:
    image: redis:7.4-alpine
    container_name: didgo-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - didgo-backend

networks:
  didgo-backend:
    name: didgo-backend

volumes:
  didgo_mysql_data:
    name: didgo-mysql-data
