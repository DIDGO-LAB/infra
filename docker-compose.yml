services:
  gateway:
    image: nginx:1.27-alpine
    container_name: msa-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - order-service
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: msa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    container_name: msa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  user-service:
    image: jangchiwsa-user-service:latest
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-jwt-secret-key-with-at-least-32-bytes
      JWT_ISSUER: user-service
      INTERNAL_API_KEY: local-internal-api-key
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  order-service:
    image: hashicorp/http-echo:1.0.0
    container_name: order-service
    command: ["-listen=:8080", "-text=order-service ok"]
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    name: jangchiwsa_backend
    external: true

volumes:
  mysql_data:
    name: jangchiwsa_mysql_data
    external: true
