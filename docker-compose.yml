services:
  gateway:
    image: nginx:1.27-alpine
    container_name: msa-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - backend

  api-gateway:
    image: didgo-api-gateway:latest
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: ${API_GATEWAY_PORT:-8080}
      USER_SERVICE_URI: ${USER_SERVICE_URI:-http://user-service:8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
    expose:
      - "8080"
    depends_on:
      - user-service
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: msa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER_APP_PASSWORD: ${MYSQL_USER_APP_PASSWORD}
      MYSQL_TRAINING_APP_PASSWORD: ${MYSQL_TRAINING_APP_PASSWORD}
      MYSQL_REPORT_APP_PASSWORD: ${MYSQL_REPORT_APP_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    container_name: msa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  user-service:
    image: didgo-user-service:latest
    build:
      context: ../user-serivce
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    name: didgo_backend
    external: true

volumes:
  mysql_data:
    name: didgo_mysql_data
    external: true
